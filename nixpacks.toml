[phases.setup]
nixPkgs = ["python311Full", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel", "python311Packages.gunicorn", "gcc", "pkg-config", "openssl", "rustc", "cargo"]

[phases.install]
cmds = [
  "if [ -f requirements.txt ]; then pip install -r requirements.txt --break-system-packages; elif [ -f requrements.txt ]; then pip install -r requrements.txt --break-system-packages; else echo 'No requirements file found' && exit 1; fi"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
