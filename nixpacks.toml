[phases.setup]
nixPkgs = ["python311Full", "gcc", "pkg-config", "openssl", "rustc", "cargo"]

[phases.install]
cmds = [
	"python -m ensurepip --upgrade || true",
	"python -m pip install --upgrade pip setuptools wheel",
	"if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; elif [ -f requrements.txt ]; then python -m pip install -r requrements.txt; else echo 'No requirements file found'; exit 1; fi"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
